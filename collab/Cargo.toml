[package]
name = "collab"
version = "0.1.0"
edition = "2024"
description = "KaiCad collaboration layer — project sharing, versioning, real-time sync"

[dependencies]
core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
