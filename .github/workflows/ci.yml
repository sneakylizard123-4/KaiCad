name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Single job: the workspace is small, so a matrix would only duplicate the
# toolchain download and the dependency build.
env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --workspace --all-targets

      # `-D warnings` is applied only to Clippy, not through a global
      # RUSTFLAGS, because global flags also apply to dependencies and build
      # scripts, where warnings are outside our control.
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --workspace --release
