name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Single job: the workspace is small, so a matrix would only duplicate the
# toolchain download and the dependency build.
env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Markdown links
        run: python3 scripts/check_markdown_links.py

      - name: Check compilation
        run: cargo check --workspace --all-targets

      # `-D warnings` is applied only to Clippy, not through a global
      # RUSTFLAGS, because global flags also apply to dependencies and build
      # scripts, where warnings are outside our control.
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build docs
        run: cargo doc --workspace --no-deps

      - name: Run tests
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --workspace --release

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Measure coverage
        run: |
          cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
