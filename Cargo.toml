[workspace]
resolver = "3"

members = [
    "core",
    "schematic",
    "pcb",
    "renderer",
    "ai",
    "collab",
    "plugin",
    "kai-cad",
    "store",
    "kicad-parser",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/sneakylizard123-4/KaiCad"
publish = false

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = "deny"

[profile.dev]
debug = true
lto = false
incremental = true
panic = "abort"

[profile.release]
debug = false
lto = true
incremental = true
panic = "abort"
opt-level = "z"
codegen-units = 1
debug-assertions = false
overflow-checks = false