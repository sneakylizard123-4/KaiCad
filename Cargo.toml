[workspace]
resolver = "3"

members = [
    "core",
    "schematic",
    "pcb",
    "renderer",
    "ai",
    "collab",
    "kai-cad",
]

[profile.dev]
debug = true
lto = false
incremental = true
panic = "abort"

[profile.release]
debug = false
lto = true
incremental = true
panic = "abort"
opt-level = "z"
codegen-units = 1
debug-assertions = false
overflow-checks = false