[package]
name = "pcb"
version = "0.1.0"
edition = "2024"
description = "KaiCad PCB engine — board outline, layers, stackup, routing"

[dependencies]
core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
collab = { path = "../collab" }
